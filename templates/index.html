<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>SkinShop</title>

</head>

<body>

    <h1>SkinShop</h1>

    {% if user %}

        <img src="{{ user.avatar }}">

        <h2>{{ user.name }}</h2>

        <a href="/logout">
            Cerrar sesión
        </a>

    {% else %}

        <a href="/login">
            Iniciar sesión con Steam
        </a>

    {% endif %}

</body>

</html>
